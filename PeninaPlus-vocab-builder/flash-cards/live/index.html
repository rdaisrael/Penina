<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><title>Penina Live</title><link rel="icon" type="image/png" href="/Penina-favicon.png"><link rel="stylesheet" href="live.css"><link rel="stylesheet" href="shofar.css"></head>
<body><main class="live-shell"><header class="topbar"><a href="../" class="brand">PENINA <span>LIVE</span></a><div id="connection" role="status">Ready to join</div></header><div id="error" role="alert" hidden></div><section id="stage" aria-label="Live study game"></section>
<div id="student-controls" hidden>
    <button id="read-card" type="button" hidden>Read full card</button>
    <button id="live-fullscreen" type="button" data-exit-label="Exit">Full screen</button>
</div>
<dialog id="card-reader" aria-labelledby="reader-title">
    <header><h2 id="reader-title">Question and answers</h2><span data-reader-clock></span></header>
    <div class="reader-pages"></div>
    <div class="reader-controls"><button type="button" data-prev>Previous</button><span role="status"></span><button type="button" data-next>Next</button><button type="button" data-done>Back to game</button></div>
</dialog>
<footer>Class vocabulary and knowledge. Shared screen. Your own answer.</footer></main><script src="qrcode.js"></script><script src="supabase.js"></script><script src="music.js"></script><script src="shofar.js"></script><script src="/PeninaPlus-knowledge-builder/cards.js"></script><script src="../../game-fullscreen.js"></script><script src="student-display.js"></script><script src="live.js"></script></body></html>
